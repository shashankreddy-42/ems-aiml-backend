# Local-only profile: persistent embedded database and non-production signing secret.
# Activate with: mvn spring-boot:run -Dspring-boot.run.profiles=dev
spring.datasource.url=jdbc:h2:file:./data/lingua;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=false
jwt.secret=${JWT_SECRET:local-only-dev-signing-secret-change-before-deployment}
cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
translation.provider=${TRANSLATION_PROVIDER:mymemory}
translation.api-url=${TRANSLATION_API_URL:https://translate.cutie.dating}
translation.api-key=${TRANSLATION_API_KEY:}
