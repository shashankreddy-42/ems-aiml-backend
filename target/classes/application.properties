spring.application.name=ai-translator
server.port=8080

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/language_translator_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Required: no default on purpose, so a missing secret fails fast.
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000

cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# Used from Phase 2
translation.provider=${TRANSLATION_PROVIDER:mock}
translation.api-url=${TRANSLATION_API_URL:}
translation.api-key=${TRANSLATION_API_KEY:}
